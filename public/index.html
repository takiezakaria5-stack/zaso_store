
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZASO | متجر المنتجات اليدوية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white border-b border-stone-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 onclick="handleAdminAccess()" class="text-3xl font-black text-amber-900 tracking-wider cursor-pointer select-none">
                ZASO
            </h1>
            <span class="bg-amber-100 text-amber-900 text-xs font-bold px-3 py-1 rounded-full">صُنع بشغف 🧶</span>
        </div>
    </header>

    <!-- Main Products Grid -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-stone-500">جاري تحميل المنتجات...</div>
        </div>
    </main>

    <!-- Admin Modal for Adding Products -->
    <div id="adminModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="toggleAdminModal()" class="absolute top-4 left-4 text-stone-400 hover:text-stone-600 text-2xl font-bold">&times;</button>
            <h2 class="text-xl font-bold text-amber-900 mb-4">إضافة منتج جديد 🛠️</h2>
            
            <form id="addProductForm" onsubmit="handleAddProduct(event)" class="space-y-3">
                <input type="text" id="pName" placeholder="اسم المنتج" required class="w-full p-3 border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-800">
                <textarea id="pDesc" placeholder="الوصف" required class="w-full p-3 border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-800"></textarea>
                <input type="number" id="pPrice" placeholder="السعر للقطعة (د.ج)" required class="w-full p-3 border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-800">
                
                <label class="block text-sm font-bold text-stone-700 mt-2">صور المنتج (يمكن اختيار أكثر من صورة):</label>
                <input type="file" id="pImages" multiple accept="image/*" required class="w-full p-2 border border-stone-300 rounded-xl">
                
                <button type="submit" class="w-full bg-amber-900 text-white font-bold py-3 rounded-xl hover:bg-amber-800 transition mt-2">نشر المنتج</button>
            </form>
        </div>
    </div>

    <!-- Checkout Modal with Quantity -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl relative">
            <button onclick="closeCheckout()" class="absolute top-4 left-4 text-stone-400 hover:text-stone-600 text-2xl font-bold">&times;</button>
            <h2 class="text-xl font-bold text-amber-900 mb-2">إتمام الطلب 🛍️</h2>
            <p id="selectedProduct" class="text-sm text-stone-500 mb-2"></p>
            
            <form onsubmit="sendOrder(event)" class="space-y-3">
                <!-- اختيار الكمية -->
                <div>
                    <label class="block text-xs font-bold text-stone-600 mb-1">الكمية المطلوبة:</label>
                    <input type="number" id="quantity" value="1" min="1" max="100" onchange="updateTotalPrice()" class="w-full p-3 border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-800 font-bold">
                </div>
                
                <!-- عرض السعر الإجمالي -->
                <div class="bg-amber-50 p-3 rounded-xl text-center border border-amber-200">
                    <span class="text-xs text-stone-600">السعر الإجمالي: </span>
                    <span id="totalPriceDisplay" class="font-black text-amber-900 text-lg">0 د.ج</span>
                </div>

                <input type="text" id="name" placeholder="الاسم الكامل" required class="w-full p-3 border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-800">
                <input type="tel" id="phone" placeholder="رقم الهاتف" required class="w-full p-3 border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-800">
                <input type="text" id="address" placeholder="الولاية والعنوان" required class="w-full p-3 border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-800">
                
                <button type="submit" class="w-full bg-green-700 text-white font-bold py-3 rounded-xl hover:bg-green-800 transition">تأكيد عبر واتساب 📲</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-stone-200 py-8 text-center mt-12">
        <div class="max-w-6xl mx-auto px-4 space-y-4">
            <h2 class="text-2xl font-black text-amber-900 tracking-wider">ZASO</h2>
            <p class="text-stone-500 text-sm">تواصلوا معنا عبر صفحاتنا الرسمية أو الواتساب مباشر</p>

            <div class="flex justify-center items-center gap-3 flex-wrap pt-2">
                <a href="https://www.instagram.com/zaso_tufting__crochet__handmad" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 bg-stone-100 hover:bg-amber-100 text-stone-800 hover:text-amber-900 px-4 py-2 rounded-xl text-sm font-bold transition border border-stone-200">
                    <span>📸 إنستغرام</span>
                </a>
                <a href="https://www.facebook.com/share/19bnsPq9Pw/" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 bg-stone-100 hover:bg-amber-100 text-stone-800 hover:text-amber-900 px-4 py-2 rounded-xl text-sm font-bold transition border border-stone-200">
                    <span>📘 فيسبوك</span>
                </a>
                <a href="https://www.tiktok.com/@zasotuftingcrochet" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 bg-stone-100 hover:bg-amber-100 text-stone-800 hover:text-amber-900 px-4 py-2 rounded-xl text-sm font-bold transition border border-stone-200">
                    <span>🎵 تيك توك</span>
                </a>
                <a href="https://wa.me/213796869800" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 bg-green-50 hover:bg-green-100 text-green-700 px-4 py-2 rounded-xl text-sm font-bold transition border border-green-200">
                    <span>💬 واتساب: 0796869800</span>
                </a>
            </div>

            <div class="text-stone-400 text-xs pt-4 border-t border-stone-100">
                © 2026 ZASO Store - جميع الحقوق محفوظة
            </div>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let currentItemTitle = "";
        let currentItemPrice = 0;
        let clickCount = 0;
        let clickTimer = null;

        function handleAdminAccess() {
            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 500);

            if (clickCount >= 3) {
                clickCount = 0;
                const password = prompt("أدخل كلمة المرور الخاصة بالإدارة:");
                if (password === "kenouni19") {
                    toggleAdminModal();
                    document.querySelectorAll('.admin-delete-btn').forEach(btn => btn.style.display = 'block');
                } else if (password !== null) {
                    alert("كلمة المرور خاطئة!");
                }
            }
        }

        function toggleAdminModal() {
            document.getElementById('adminModal').classList.toggle('hidden');
        }

        function openCheckout(title, price) {
            currentItemTitle = title;
            currentItemPrice = Number(price);
            document.getElementById('selectedProduct').innerText = `المنتج: ${title} (${price} د.ج للقطعة)`;
            document.getElementById('quantity').value = 1;
            updateTotalPrice();
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function updateTotalPrice() {
            const qty = document.getElementById('quantity').value || 1;
            const total = currentItemPrice * qty;
            document.getElementById('totalPriceDisplay').innerText = `${total} د.ج`;
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        function changeImg(imgId, newSrc) {
            document.getElementById(imgId).src = newSrc;
        }

        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                const grid = document.getElementById('productsGrid');

                if (!products || products.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-stone-500">لا توجد منتجات حالياً</div>`;
                    return;
                }

                grid.innerHTML = products.map(p => {
                    const prodName = p.name || p.title || 'منتج زاسو';
                    return `
                    <div class="bg-white rounded-3xl shadow-sm border border-stone-200 p-4 flex flex-col justify-between">
                        <div>
                            <div class="h-64 bg-stone-100 rounded-2xl overflow-hidden mb-4">
                                <img id="mainImg-${p.id}" src="${p.images && p.images[0] ? p.images[0] : ''}" alt="${prodName}" class="w-full h-full object-cover">
                            </div>
                            ${p.images && p.images.length > 1 ? `
                            <div class="flex gap-2 mb-4 justify-center overflow-x-auto pb-1">
                                ${p.images.map(img => `
                                    <img src="${img}" onclick="changeImg('mainImg-${p.id}', '${img}')" class="w-12 h-12 object-cover rounded-lg cursor-pointer border hover:border-amber-800">
                                `).join('')}
                            </div>` : ''}
                            <h3 class="font-bold text-lg text-stone-800 mb-1">${prodName}</h3>
                            <p class="text-stone-500 text-sm mb-3">${p.description || ''}</p>
                            <div class="text-amber-900 font-bold text-xl mb-4">${p.price} د.ج</div>
                        </div>
                        
                        <div class="space-y-2">
                            <button onclick="openCheckout('${prodName.replace(/'/g, "\\'")}', '${p.price}')" class="w-full bg-amber-800 text-white font-bold py-3 rounded-xl hover:bg-amber-900 transition">اطلب الآن</button>
                            <button onclick="deleteProduct('${p.id}')" class="admin-delete-btn bg-red-600 text-white font-bold py-2 px-3 rounded-xl text-sm hover:bg-red-700 transition w-full" style="display:none;">حذف المنتج 🗑️</button>
                        </div>
                    </div>
                `}).join('');
            } catch (err) {
                console.error("Error loading products:", err);
            }
        }

        async function handleAddProduct(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('pName').value);
            formData.append('description', document.getElementById('pDesc').value);
            formData.append('price', document.getElementById('pPrice').value);
            
            const files = document.getElementById('pImages').files;
            for (let i = 0; i < files.length; i++) {
                formData.append('images', files[i]);
            }

            const res = await fetch('/api/products', {
                method: 'POST',
                body: formData
            });

            if (res.ok) {
                alert('تم إضافة المنتج بنجاح!');
                toggleAdminModal();
                loadProducts();
            } else {
                alert('حدث خطأ أثناء إضافة المنتج');
            }
        }

        async function deleteProduct(id) {
            if (confirm("هل تريد حذف هذا المنتج حقاً؟")) {
                const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    alert("تم حذف المنتج بنجاح");
                    loadProducts();
                } else {
                    alert("فشل حذف المنتج");
                }
            }
        }

        function sendOrder(e) {
            e.preventDefault();
            const quantity = document.getElementById('quantity').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const myPhoneNumber = "213796869800";

            const totalPrice = currentItemPrice * quantity;
            const message = `طلب جديد من موقع ZASO:\n- المنتج: ${currentItemTitle}\n- الكمية: ${quantity}\n- السعر الإجمالي: ${totalPrice} د.ج\n- الاسم: ${name}\n- الهاتف: ${phone}\n- العنوان: ${address}`;

            window.open(`https://wa.me/${myPhoneNumber}?text=${encodeURIComponent(message)}`, '_blank');
            closeCheckout();
        }

        loadProducts();
    </script>
</body>
</html>
